<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punjabi Rewind — Offline</title>
<style>
  :root{--ink:#0b0b0d;--paper:#F3F3F3;--marigold:#ECA31C;--muted:#A7A7AE}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:auto}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:34px 22px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:Anton,sans-serif;font-size:34px;margin:0;letter-spacing:.01em}
  p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
  .badge span{font-size:12px;color:var(--muted)}
  .badge b{color:var(--marigold)}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
  .item strong{font-size:13px;font-weight:600}
  .item small{font-size:11.5px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12.5px;padding:6px 2px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;background:var(--marigold);color:#111;font-weight:700;font-size:13px;text-decoration:none}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">⚠️ <span>Offline fallback — saved favorites</span></div>
    <h1>Punjabi Rewind</h1>
    <p>WebGL or the main app failed to load. You can still browse your saved favorites below, or retry the full experience.</p>
    <a class="btn" href=".">Retry full app →</a>
    <div id="favList" class="list"></div>
  </div>
<script>
  (function(){
    const out = document.getElementById('favList');
    try {
      const favs = JSON.parse(localStorage.getItem('pr_favorites') || '[]');
      const songs = window.SONGS || [];
      if (!favs.length) { out.innerHTML = '<div class="empty">No saved favorites yet. Open the app and star tracks to save them.</div>'; return; }
      out.innerHTML = favs.map(i => {
        const s = songs[i];
        if (!s) return '';
        return `<div class="item"><div><strong>${s.title}</strong><small> · ${s.artist} · ${s.year}</small></div><small>${s.lang === 'hindi' ? 'Hindi' : 'Punjabi'}</div>`;
      }).join('');
    } catch (e) { out.innerHTML = '<div class="empty">Could not load saved favorites.</div>'; }
  })();
</script>
</body>
</html>
